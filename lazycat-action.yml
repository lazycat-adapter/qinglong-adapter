version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.qinglong.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/whyour/qinglong.git
  select:
    strategy: semver-tag
    # Only published stable release tags. RC, beta, and rolling image aliases are excluded.
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
changelog:
  mode: github-release
  git_url: https://github.com/whyour/qinglong.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: true
  prepare:
    mode: command
    context: image
    command: |
      if python3 -c 'import yaml' 2>/dev/null; then
        python3 -B scripts/prepare.py
      else
        python3 -m venv .lazycat-action/venv
        .lazycat-action/venv/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
        .lazycat-action/venv/bin/python -B scripts/prepare.py
      fi
    output_image: 'ttl.sh/qinglong-lazycat-{fingerprint}:24h'
images:
  - id: gateway
    target: service
    service: gateway
    source: docker.io/whyour/qinglong:{source_version}
    delivery:
      mode: lazycat
      copy_timeout: 30m
      copy_idle_timeout: 10m
stores:
  official:
    enabled: true
    create_if_missing: false
    skip_if_version_exists: true
    continue_if_newer_version: true
